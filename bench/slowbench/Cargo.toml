[package]
name = "slowbench"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
iroh-gossip = { path = "../.." }
iroh = { version = "1", default-features = false, features = ["tls-ring", "metrics"] }
iroh-metrics = "1"
patchbay = "0.7"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde_json = "1"
bytes = "1"
n0-future = "0.3"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Not part of the iroh-gossip workspace.
[workspace]
