name: run simulations
on:
  pull_request:

# Default to read-only; jobs that need more grant it explicitly.
permissions:
  contents: read

jobs:
  run_sim:
    permissions:
      contents: read
      pull-requests: write   # posts the simulation report
    runs-on: ubuntu-latest
    env:
      RUSTC_WRAPPER: "sccache"
      SCCACHE_GHA_ENABLED: "on"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install rust stable
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: stable

      - name: Install sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      - name: Run simulations
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git checkout "$GITHUB_BASE_REF"
          cargo run -q --locked --bin sim --features simulator --release -- run -c simulations/all.toml -o /tmp/sim-main
          git checkout "$HEAD_SHA"
          cargo run -q --locked --bin sim --features simulator --release -- run -c simulations/all.toml -o /tmp/sim-pr --baseline /tmp/sim-main |& tee REPORT
          echo "<details><summary>Simulation report</summary>" >> COMMENT
          echo "" >> COMMENT
          echo '```' >> COMMENT
          cat REPORT >> COMMENT
          echo "" >> COMMENT
          echo '```' >> COMMENT
          echo "</details>" >> COMMENT
          echo "" >> COMMENT
          echo "*Last updated: $(date -u +'%Y-%m-%dT%H:%M:%SZ')*" >> COMMENT

      - name: Find Docs Comment
        uses: peter-evans/find-comment@b30e6a3c0ed37e7c023ccd3f1db5c6c0b0c23aad # v4.0.0
        id: fc
        with:
          issue-number: ${{ github.event.pull_request.number || inputs.pr_number }}
          comment-author: "github-actions[bot]"
          body-includes: Simulation report

      - name: Create or Update Docs Comment
        uses: peter-evans/create-or-update-comment@e8674b075228eee787fea43ef493e45ece1004c9 # v5.0.0
        with:
          issue-number: ${{ github.event.pull_request.number || inputs.pr_number }}
          comment-id: ${{ steps.fc.outputs.comment-id }}
          body-path: COMMENT
          edit-mode: replace
